<style>
  /* Layout: full-screen deck photo under a teal tint; logo top-left, promise centred on the left, rule and copyright at the foot. */
  :root {
    --teal: #10343E;
    --ivory: #F5F1E9;
    --ivory-rule: rgba(245, 241, 233, 0.22);
    --brass: #A38A5C;
    --font: "Noto Sans", Arial, sans-serif;
    --serif: "Noto Serif", Georgia, serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--teal); color: var(--ivory); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .scene { position: relative; min-height: 100%; display: flex; flex-direction: column; overflow: hidden; isolation: isolate; }
  .scene-photo { position: absolute; inset: 0; z-index: -2; }
  .scene-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 80% 30%; display: block; max-width: none; }
  .scene::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(90deg,
      rgba(16, 52, 62, 0.97) 0%,
      rgba(16, 52, 62, 0.93) 30%,
      rgba(16, 52, 62, 0.7) 46%,
      rgba(16, 52, 62, 0.28) 60%,
      rgba(16, 52, 62, 0.16) 100%);
  }
  .inner {
    flex: 1; display: flex; flex-direction: column;
    width: 100%; box-sizing: border-box;
    padding-block: clamp(20px, 2.6vh, 28px) clamp(28px, 4vh, 40px);
    padding-left: max(clamp(20px, 6.3vw, 100px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(20px, 7.7vw, 124px), env(safe-area-inset-right, 0px));
  }
  .logo { width: clamp(220px, 30.5vw, 486px); height: auto; display: block; }
  .message { margin-block: auto; padding-block: 48px; max-width: 46rem; }
  h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 4.3vw, 70px); line-height: 1.24; letter-spacing: 0; }
  h1 span { display: block; color: var(--brass); }
  .message p { margin: clamp(14px, 1.6vw, 24px) 0 0; font-size: clamp(16px, 1.45vw, 23px); line-height: 1.5; letter-spacing: 0.02em; color: var(--ivory); }
  footer { border-top: 1px solid var(--ivory-rule); padding-top: clamp(18px, 2.6vh, 26px); font-size: clamp(13px, 1vw, 16px); letter-spacing: 0.02em; color: var(--ivory); }
  @media (max-width: 760px) {
    .scene::before { background: linear-gradient(180deg, rgba(16, 52, 62, 0.95) 0%, rgba(16, 52, 62, 0.85) 50%, rgba(16, 52, 62, 0.55) 100%); }
    .scene-photo img { object-position: 78% 40%; }
  }
</style>
